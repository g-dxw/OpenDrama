name: opendrama-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: opendrama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendrama
      POSTGRES_PASSWORD: opendrama_local
      POSTGRES_DB: opendrama
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - opendrama_pg:/var/lib/postgresql/data
    networks:
      - opendrama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendrama -d opendrama"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: opendrama-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: opendrama_local
    command: ["redis-server", "--requirepass", "opendrama_local", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - opendrama_redis:/data
    networks:
      - opendrama
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  opendrama:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.20.0/24

volumes:
  opendrama_pg:
  opendrama_redis:
