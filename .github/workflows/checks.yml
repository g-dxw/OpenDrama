name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jjtv_ci
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: jjtv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jjtv_ci -d jjtv_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://jjtv_ci:ci-disposable-password@127.0.0.1:5432/jjtv_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      MINITV_TEST_DB: jjtv_ci_test
      MINITV_TEST_REDIS_DB: '15'
      BUNNY_MODE: fake
      MODERATION_WORKER: '0'
      RESEND_API_KEY: ''
      RESEND_FROM: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install proxy acceptance runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-core
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Run backend, tenant isolation, and migration tests
        working-directory: backend
        run: python -m pytest -q
      - name: Check shared release allocation and self-host defaults
        run: python -m pytest tests -q

  frontends:
    name: Build ${{ matrix.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        frontend: [web, h5, admin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        working-directory: ${{ matrix.frontend }}
        run: npm ci
      - name: Type check and build committed source
        run: python scripts/build_frontends.py --frontend ${{ matrix.frontend }}
      - name: Check H5 routes, gestures, and playback recovery
        if: matrix.frontend == 'h5'
        working-directory: h5
        run: npm run test:unit
      - name: Check desktop flows, languages, and independent mobile surface
        if: matrix.frontend == 'web'
        working-directory: web
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOTS_DIR: ${{ runner.temp }}/jjtv-pc-acceptance
        run: npm run accept:client && npm run accept:consumer && npm run accept:subtitles && npm run accept:visual && npm run accept:locales && npm run accept:surface
      - name: Check preserved H5 account and player flows
        if: matrix.frontend == 'h5'
        working-directory: h5
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOTS_DIR: ${{ runner.temp }}/jjtv-h5-acceptance
        run: npm run verify:consumer
      - name: Check management pages and role guards
        if: matrix.frontend == 'admin'
        working-directory: admin
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOTS_DIR: ${{ runner.temp }}/jjtv-admin-acceptance
        run: npm run accept:parity && npm run accept:commerce && npm run accept:login
      - name: Keep browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjtv-${{ matrix.frontend }}-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jjtv-pc-acceptance/
            ${{ runner.temp }}/jjtv-admin-acceptance/
            ${{ runner.temp }}/jjtv-h5-acceptance/
          if-no-files-found: warn
          retention-days: 7
      - name: Keep the checked frontend build
        uses: actions/upload-artifact@v4
        with:
          name: jjtv-${{ matrix.frontend }}-${{ github.sha }}
          path: ${{ matrix.frontend }}/dist/
          if-no-files-found: error
          retention-days: 7
