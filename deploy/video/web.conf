server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 8080;
    server_name jjtv.8jj.net;
    root /usr/share/nginx/html/web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /cli/ { alias /srv/cli/; types { } default_type text/plain; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8080;
    server_name jjtv-h5.8jj.net;
    root /usr/share/nginx/html/h5;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8080;
    server_name jjtv-admin.8jj.net;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files /admin$uri /admin$uri/ /admin/index.html; }
}

server {
    listen 8080;
    server_name jjtv-api.8jj.net;
    client_max_body_size 32m;
    # The legacy development callback must never be exposed on this deployment.
    location = /v1/billing/webhook { return 404; }
    # Match the adapter's safe IDs. OPTIONS is required for browser CORS preflight.
    location ~ "^/admin/v1/tenants/india-short-drama/india/admin/(uploads|covers|rights/evidence)/[A-Za-z0-9_-]{1,160}/content$" {
        limit_except PUT OPTIONS { deny all; }
        client_max_body_size 100m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }
}
