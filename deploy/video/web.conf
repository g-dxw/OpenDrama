server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 8080;
    server_name jjtv.8jj.net;
    root /usr/share/nginx/html/web;
    location = /v1/billing/webhook { return 404; }
    location /v1/ {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    index index.html;
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    location /cli/ { alias /srv/cli/; types { } default_type text/plain; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8080;
    server_name jjtv-h5.8jj.net;
    root /usr/share/nginx/html/h5;
    location = /v1/billing/webhook { return 404; }
    location /v1/ {
        proxy_pass http://jjtv-api-internal:18110;
