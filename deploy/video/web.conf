    add_header X-Content-Type-Options nosniff always;
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8080;
    server_name jjtv-admin.8jj.net;
    location = /health {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
    }
    # Stripe accepts only these signed callbacks. Other viewer APIs, including
    # the development payment protocol, are not exposed on the admin origin.
    location ~ "^/v1/billing/stripe/(webhook|accounts/[a-z0-9_]{2,32}/webhook)$" {
        limit_except POST { deny all; }
        client_max_body_size 32m;
        client_body_timeout 30s;
        proxy_pass http://jjtv-api-internal:18110;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
        proxy_set_header Stripe-Signature $http_stripe_signature;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }
    location /v1/ { return 404; }
    # Same-origin admin uploads need the same streaming and method limits as API uploads.
    location ~ "^/admin/v1/tenants/india-short-drama/india/admin/(uploads|covers|rights/evidence)/[A-Za-z0-9_-]{1,160}/content$" {
        limit_except PUT OPTIONS { deny all; }
        client_max_body_size 100m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }
    location /admin/v1/ {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
    }
    location ~ ^/(platform|tenant|partner)/ {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
    }
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /cli/ { alias /srv/cli/; types { } default_type text/plain; }
    location = /admin/index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }
    location = /index.html { rewrite ^ /admin/index.html last; }
    location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files /admin$uri /admin$uri/ /admin/index.html; }
}

server {
    listen 8080;
    server_name jjtv-api.8jj.net;
    client_max_body_size 32m;
    # The legacy development callback must never be exposed on this deployment.
    location = /v1/billing/webhook { return 404; }
    # Match the adapter's safe IDs. OPTIONS is required for browser CORS preflight.
    location ~ "^/admin/v1/tenants/india-short-drama/india/admin/(uploads|covers|rights/evidence)/[A-Za-z0-9_-]{1,160}/content$" {
        limit_except PUT OPTIONS { deny all; }
        client_max_body_size 100m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://jjtv-api-internal:18110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }
}
