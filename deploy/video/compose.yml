name: jjtv

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jjtv
      POSTGRES_DB: jjtv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjtv -d jjtv"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: jjtv-api:${JJTV_SOURCE_SHA:?}
    networks:
      default:
        aliases:
          - jjtv-api-internal
    build:
      context: ../..
      dockerfile: deploy/video/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${JJTV_ENV_FILE:?}
    volumes:
      - type: bind
        source: ${JJTV_INDIA_CLIENT_DIR:-/opt/jjtv/shared/india-client}
        target: /run/secrets/india-client
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18110:18110"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18110/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18111:8080"
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web/dist:/usr/share/nginx/html/web:ro
      - ../../h5/dist:/usr/share/nginx/html/h5:ro
      - ../../admin/dist:/usr/share/nginx/html/admin:ro
      - ../../cli:/srv/cli:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases:
          - jjtv-web

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
    external: true
    name: ${JJTV_EDGE_NETWORK:-dastaan-staging_default}
