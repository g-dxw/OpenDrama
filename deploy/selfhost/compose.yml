name: opendrama-selfhost
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opendrama
      POSTGRES_DB: opendrama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init_env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U opendrama -d opendrama"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendrama:${POSTGRES_PASSWORD}@postgres:5432/opendrama
      REDIS_URL: redis://redis:6379/0
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendrama:${POSTGRES_PASSWORD}@postgres:5432/opendrama
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
  web:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile.web
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
