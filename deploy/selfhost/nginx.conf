# TLS terminates at the deployment's reverse proxy. It must preserve Host.
map $host $site_root {
    default /srv/web;
    ~^m- /srv/h5;
}
server {
    listen 80 default_server;
    server_name _;
    root $site_root;
    client_max_body_size 1g;
    location = /v1/billing/webhook { return 404; }
    location /health { proxy_pass http://api:8000; }
    location ~ ^/(v1|platform|tenant|partner)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Site-Country "";
    }
    location /admin/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
    location /cli/ { alias /srv/cli/; default_type text/plain; }
    location = /admin { return 302 /admin/; }
    location /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
